name: Build
on: [push]
jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: ilammy/setup-nasm@v1

      - run: rustup override set nightly

      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --no-default-features
