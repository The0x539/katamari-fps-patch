[package]
name = "katamari-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.dev]
opt-level = 1
debug = "full"
overflow-checks = false
debug-assertions = false
panic = "abort"

[dependencies]
eyre = "0.6.12"
retour = "0.3.1"
windows-strings = "0.5.1"

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
]
